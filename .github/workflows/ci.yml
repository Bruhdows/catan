name: Verify
on:
  push:
    branches: [main, review/critical-rules-fixes]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test -- --reporter=dot
      - run: npm run build
      - name: Verify generated assets
        run: test -f apps/web/dist/index.html
