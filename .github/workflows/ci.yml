name: Verify
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The original agent's lockfile predates the web workspace; keep
      # installs functional until the lock is regenerated and committed.
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run check
      - run: npm test -- --reporter=dot
      - run: npm run build
      - name: Verify frontend and prerender
        run: |
          test -f apps/web/dist/index.html
          test -f apps/web/dist/rules/index.html
          test -f apps/web/dist/rules/robber/index.html
      - name: Refresh dependency lockfile for review
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile
          path: package-lock.json
      # One-time lockfile refresh for this same-repository review branch.
      - name: Commit workspace lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'review/critical-rules-fixes' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "+refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"
          git switch --detach "refs/remotes/origin/${HEAD_REF}"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate npm workspace lockfile"
            git push origin "HEAD:refs/heads/${HEAD_REF}"
          fi

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
